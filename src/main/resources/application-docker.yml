spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:restaurante}?sslmode=${DB_SSL_MODE:prefer}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    mongodb:
      auto-index-creation: false
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:admin}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:restaurante}?authSource=admin&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:TXkgc3VwZXIgc2VjcmV0IGtleSBwYXJhIGVsIHJlc3RhdXJhbnRl}
  expiration-ms: ${JWT_EXPIRATION:3600000}

server:
  port: ${SERVER_PORT:8080}
