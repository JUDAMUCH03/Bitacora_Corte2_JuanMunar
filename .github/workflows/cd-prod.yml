name: CD — Despliegue a Producción

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:
  test:
    name: 🧪 Verificación de Calidad en Release (Pre-Deploy)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blue_velvet_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Suite Completa de Pruebas
        run: mvn clean test --no-transfer-progress

  build-and-push-prod:
    name: 🐳 Empaquetar y Publicar Imagen PROD en Docker Hub
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=prod-latest
            type=sha,prefix=prod-,format=short
            type=semver,pattern={{version}}

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: 🚀 Despliegue Controlado en Azure App Service PROD
    needs: build-and-push-prod
    runs-on: ubuntu-24.04
    steps:
      - name: Autenticación en Azure con Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Decisión FinOps: Reutilización de la base de datos de PostgreSQL para optimización de costos en Azure
      - name: Inyectar variables de entorno en Azure App Service PROD (CLI Nativo)
        uses: azure/cli@v2
        env:
          RAW_APP_PROD: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          RAW_APP_QA: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          RAW_JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          RAW_DB_HOST: ${{ secrets.DB_HOST_QA }}
          RAW_DB_PASSWORD: ${{ secrets.DB_PASSWORD_QA }}
        with:
          inlineScript: |
            APP_PROD=$(printf '%s' "$RAW_APP_PROD" | tr -d '\r\n' | xargs)
            APP_QA=$(printf '%s' "$RAW_APP_QA" | tr -d '\r\n' | xargs)
            CLEAN_JWT=$(printf '%s' "$RAW_JWT_SECRET" | tr -d '\r\n' | xargs)
            CLEAN_DB_HOST=$(printf '%s' "$RAW_DB_HOST" | tr -d '\r\n' | xargs)
            CLEAN_DB_PASS=$(printf '%s' "$RAW_DB_PASSWORD" | tr -d '\r\n' | xargs)
            PG_SERVER="${CLEAN_DB_HOST%%.*}"

            echo "Asegurando disponibilidad y reglas de firewall en PostgreSQL: $PG_SERVER"
            az postgres flexible-server start -g rg-bluevelvet -n "$PG_SERVER" || true
            az postgres flexible-server firewall-rule create -g rg-bluevelvet -n "$PG_SERVER" --rule-name AllowAllWindowsAzureIps --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 || true
            az postgres flexible-server firewall-rule create -g rg-bluevelvet -n "$PG_SERVER" --rule-name AllowAllPublicIps --start-ip-address 0.0.0.0 --end-ip-address 255.255.255.255 || true

            if [ -n "$APP_QA" ]; then
              az webapp stop --name "$APP_QA" --resource-group "rg-bluevelvet" || true
            fi

            az webapp config appsettings set \
              --name "$APP_PROD" \
              --resource-group "rg-bluevelvet" \
              --settings \
                SPRING_PROFILES_ACTIVE="docker" \
                SERVER_PORT="8080" \
                PORT="8080" \
                WEBSITES_PORT="8080" \
                WEBSITES_CONTAINER_START_TIME_LIMIT="1800" \
                JAVA_TOOL_OPTIONS="-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms128m -Xmx512m -Djava.security.egd=file:/dev/./urandom" \
                JWT_SECRET="$CLEAN_JWT" \
                DB_HOST="$CLEAN_DB_HOST" \
                DB_PORT="5432" \
                DB_NAME="restaurante" \
                DB_USER="blueadmin" \
                DB_PASSWORD="$CLEAN_DB_PASS"

      - name: Desplegar Contenedor Docker en Azure PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ env.IMAGE_NAME }}:prod-latest

      - name: Reiniciar y Validar Inicio en Azure PROD
        uses: azure/cli@v2
        env:
          RAW_APP_PROD: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
        with:
          inlineScript: |
            APP_PROD=$(printf '%s' "$RAW_APP_PROD" | tr -d '\r\n' | xargs)
            az webapp start --name "$APP_PROD" --resource-group "rg-bluevelvet" || true
            az webapp restart --name "$APP_PROD" --resource-group "rg-bluevelvet"
            HOST=$(az webapp show --name "$APP_PROD" --resource-group "rg-bluevelvet" --query "defaultHostName" -o tsv | tr -d '\r\n')
            echo "Verificando salud de https://$HOST/api/v1/platos ..."
            for i in $(seq 1 36); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$HOST/api/v1/platos" || echo "000")
              echo "Intento $i/36: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "API PROD en linea y conectada a PostgreSQL!"
                break
              fi
              sleep 5
            done

  notify:
    name: 📣 Resumen de Entrega Productiva
    needs: [build-and-push-prod, deploy-prod]
    runs-on: ubuntu-24.04
    steps:
      - name: Publicar estado de despliegue
        run: |
          echo "======================================================="
          echo "✅ Despliegue a PRODUCCIÓN completado con éxito."
          echo "Etiqueta / Versión: ${{ github.ref_name }}"
          echo "URL: https://${{ secrets.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/swagger-ui/index.html"
          echo "======================================================="
