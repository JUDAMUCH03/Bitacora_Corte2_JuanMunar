name: CI — Build · Test · Deploy QA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:
  test:
    name: 🧪 Pruebas Unitarias e Integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blue_velvet_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Ejecutar batería de pruebas
        run: mvn test --no-transfer-progress

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-qa
          path: target/site/jacoco/
          if-no-files-found: ignore

  build-and-push:
    name: 🐳 Build y Push Imagen QA a Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # PASO OBLIGATORIO: Inicializa el driver docker-container para habilitar type=gha
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-,format=short

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: 🚀 Despliegue Automático en Azure QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Autenticación en Azure con Service Principal
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar contenedor en Azure App Service (QA)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ env.IMAGE_NAME }}:qa-latest

      - name: Inyectar variables de entorno en Azure App Service QA
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "SERVER_PORT", "value": "8080"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_QA }}"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST_QA }}"},
              {"name": "DB_PORT", "value": "5432"},
              {"name": "DB_NAME", "value": "restaurante"},
              {"name": "DB_USER", "value": "blueadmin"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD_QA }}"}
            ]
