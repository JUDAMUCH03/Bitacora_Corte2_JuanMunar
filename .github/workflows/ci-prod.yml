name: CD — Deploy PROD

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:
  build-prod:
    name: 🐳 Build y Push Imagen PROD
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extracción de metadatos de versión semántica
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Compilar y publicar imagen productiva
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-prod:
    name: 🚀 Despliegue Controlado en Azure PROD
    needs: build-prod
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Autenticación en Azure con Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar versión etiquetada en Azure App Service (PROD)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ env.IMAGE_NAME }}:${{ needs.build-prod.outputs.version }}

      - name: Inyectar variables de entorno en Azure App Service PROD
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "SERVER_PORT", "value": "8080"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_PROD }}"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST_PROD }}"},
              {"name": "DB_PORT", "value": "5432"},
              {"name": "DB_NAME", "value": "restaurante"},
              {"name": "DB_USER", "value": "postgres"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD_PROD }}"}
            ]

  notify:
    name: 📣 Resumen de Entrega Productiva
    needs: [build-prod, deploy-prod]
    runs-on: ubuntu-24.04
    steps:
      - name: Publicar estado de despliegue
        run: |
          echo "======================================================="
          echo "✅ Despliegue a PRODUCCIÓN completado con éxito."
          echo "Etiqueta / Versión: ${{ github.ref_name }}"
          echo "URL: https://${{ secrets.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/swagger-ui/index.html"
          echo "======================================================="
